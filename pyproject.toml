[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roland-d20-tools"
version = "0.1.0"
description = "Safe converters for Roland D-20 Sound and Rhythm disk files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Roland D-20 Tools contributors"}]
keywords = ["roland", "d-20", "midi", "sysex", "floppy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = ["mido>=1.3,<2"]

[project.urls]
Homepage = "https://github.com/REPLACE-ME/roland-d20-tools"
Issues = "https://github.com/REPLACE-ME/roland-d20-tools/issues"

[project.scripts]
d20-tools = "roland_d20_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
