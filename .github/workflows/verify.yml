name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: python -m coverage report --include '*/song.py,*/pattern.py' --fail-under=100
      - run: python -m build
      - name: Smoke-install the wheel
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install dist/*.whl
          smoke-venv/bin/d20-tools --help
          smoke-venv/bin/d20-tools doctor
          smoke-venv/bin/d20-tools find . nothing --format json
      - name: Test the source archive in a clean environment
        run: |
          mkdir source-tree
          tar -xzf dist/*.tar.gz --strip-components=1 -C source-tree
          python -m venv source-test-venv
          source-test-venv/bin/python -m pip install "./source-tree[dev]"
          source-test-venv/bin/python -m unittest discover -s source-tree/tests -v
